<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>学习本 · 管理后台</title>
  <style>
    :root{color-scheme:light;--bg:#f4f6fb;--panel:#fff;--ink:#20283b;--muted:#70798d;--line:#e3e7f0;--blue:#365bd4;--green:#16835b;--red:#c7434c}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
    .wrap{max-width:1400px;margin:0 auto;padding:24px}.head{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}.head h1{font-size:22px;margin:0}.head a{color:var(--blue);text-decoration:none}
    .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px;box-shadow:0 4px 18px #1f2d4d08}
    .auth{display:flex;gap:10px;align-items:end;flex-wrap:wrap}.field{display:grid;gap:5px;flex:1 1 360px}.field label{font-size:12px;color:var(--muted)}input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;font:inherit}
    button{border:1px solid var(--blue);background:var(--blue);color:white;font:inherit;font-weight:700;padding:10px 15px;border-radius:9px;cursor:pointer}button.secondary{background:white;color:var(--ink);border-color:var(--line)}button:disabled{opacity:.45;cursor:wait}
    .status{font-size:12px;color:var(--muted);margin-top:9px}.error{color:var(--red)}.metrics{display:grid;grid-template-columns:repeat(5,minmax(130px,1fr));gap:10px}.metric{padding:13px;border:1px solid var(--line);border-radius:11px;background:#fbfcff}.metric strong{display:block;font-size:24px;line-height:1.3;font-variant-numeric:tabular-nums}.metric span{font-size:12px;color:var(--muted)}
    .panel-title{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}.panel-title h2{margin:0;font-size:16px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:950px;font-size:12px}th,td{text-align:left;padding:10px 9px;border-bottom:1px solid var(--line);vertical-align:top}th{position:sticky;top:0;background:#f8f9fc;color:#5e687c;font-weight:800;white-space:nowrap}.id{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:#68738a;font-size:11px;word-break:break-all;max-width:190px}.muted{color:var(--muted)}.verified{color:var(--green);font-weight:700}.pending{color:#a66a12;font-weight:700}.pager{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-top:12px}.pager span{font-size:12px;color:var(--muted)}.feedback-item{padding:12px 0;border-bottom:1px solid var(--line)}.feedback-item:last-child{border:0}.feedback-meta{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;font-size:11px;color:var(--muted)}.feedback-text{white-space:pre-wrap;margin:6px 0;font-size:13px}.feedback-actions{display:flex;gap:6px;flex-wrap:wrap}.feedback-actions button{padding:6px 9px;font-size:11px}.feedback-actions button.secondary{background:#fff}.empty{padding:22px;text-align:center;color:var(--muted)}
    @media(max-width:850px){.wrap{padding:14px}.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.auth button{width:100%}}
  </style>
</head>
<body>
  <main class="wrap">
    <header class="head"><div><h1>法律学习本 · 管理后台</h1><div class="muted">用户、设备、笔记、圈画与学习时长统计；不会展示用户的私人笔记内容。</div></div><a href="/">返回学习页面 →</a></header>
    <section class="panel">
      <div class="auth">
        <div class="field"><label for="adminToken">ADMIN_TOKEN</label><input id="adminToken" type="password" autocomplete="current-password" placeholder="输入服务端配置的 ADMIN_TOKEN"></div>
        <button id="load">验证并加载</button>
        <button class="secondary" id="forget">清除此页面的令牌</button>
      </div>
      <div id="status" class="status">令牌只保存在当前浏览器标签页的 sessionStorage 中，不会发送到其他站点。</div>
    </section>
    <section class="panel">
      <div class="panel-title"><h2>总体概况</h2><span id="generated" class="muted"></span></div>
      <div class="metrics" id="metrics"><div class="empty">输入 ADMIN_TOKEN 后加载</div></div>
    </section>
    <section class="panel">
      <div class="panel-title"><h2>用户列表</h2><span id="userTotal" class="muted"></span></div>
      <div class="table-wrap"><table><thead><tr><th>昵称 / 用户 ID</th><th>邮箱</th><th>创建时间</th><th>设备数</th><th>最近活跃</th><th>笔记题数</th><th>有圈画的题数</th><th>笔迹数</th><th>笔记数据大小</th><th>学习时长</th><th>管理</th></tr></thead><tbody id="users"><tr><td colspan="11" class="empty">尚未加载</td></tr></tbody></table></div>
      <div class="pager"><button class="secondary" id="prev" disabled>上一页</button><span id="page">—</span><button class="secondary" id="next" disabled>下一页</button></div>
    </section>
    <section class="panel">
      <div class="panel-title"><h2>用户反馈</h2><button class="secondary" id="refreshFeedback">刷新反馈</button></div>
      <div id="feedback"><div class="empty">尚未加载</div></div>
    </section>
  </main>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const state = {token:sessionStorage.getItem('lawStudyAdminToken')||'',offset:0,limit:50,total:0};
  $('adminToken').value=state.token;
  function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
  function time(v){return v?new Date(v).toLocaleString():'—';}
  function duration(v){const m=Math.floor((Number(v)||0)/60000),h=Math.floor(m/60);return h?`${h} 小时 ${m%60} 分钟`:`${m} 分钟`;}
  function bytes(v){if(!v)return '0 B';if(v<1024)return v+' B';if(v<1024*1024)return (v/1024).toFixed(1)+' KB';return (v/1024/1024).toFixed(2)+' MB';}
  function setStatus(s,bad=false){$('status').textContent=s;$('status').classList.toggle('error',bad);}
  async function api(path,options={}){
    const res=await fetch(path,{...options,headers:{'X-Admin-Token':state.token,...(options.headers||{})}});
    let data={};try{data=await res.json();}catch{}
    if(!res.ok)throw new Error(data.detail||('请求失败：HTTP '+res.status));return data;
  }
  function renderMetrics(d){
    const list=[['用户总数',d.users],['设备总数',d.devices],['24 小时活跃设备',d.active_devices_24h],['笔记题数',d.notes],['有圈画的题数',d.annotated_notes],['笔迹总数',d.strokes],['题友心得',d.experiences],['反馈总数',d.feedback],['待处理反馈',d.feedback_new],['笔记数据量',bytes(d.note_storage_bytes)],['累计学习时长',duration(d.study_time_ms)]];
    $('metrics').innerHTML=list.map(([label,value])=>`<div class="metric"><strong>${esc(value)}</strong><span>${label}</span></div>`).join('');$('generated').textContent='统计时间：'+time(d.generated_at);
  }
  function renderUsers(items){
    if(!items.length){$('users').innerHTML='<tr><td colspan="11" class="empty">没有用户记录</td></tr>';return;}
    $('users').innerHTML=items.map(u=>`<tr><td><strong>${esc(u.nickname||'未设置昵称')}</strong><div class="id">${esc(u.id)}</div></td><td>${esc(u.email||'—')} ${u.email_verified?'<span class="verified">已验证</span>':''}</td><td>${time(u.created_at)}</td><td>${u.devices}</td><td>${time(u.last_seen)}</td><td>${u.notes}</td><td>${u.annotated_notes}</td><td>${u.strokes}</td><td>${bytes(u.note_bytes)}</td><td>${duration(u.study_time_ms)}</td><td><button class="secondary" data-study-user="${esc(u.id)}" data-study-ms="${Number(u.study_time_ms)||0}">修改时长</button> <button class="secondary" data-recovery-user="${esc(u.id)}">重置连接码</button></td></tr>`).join('');
  }
  async function loadUsers(){
    const d=await api(`/api/admin/users?limit=${state.limit}&offset=${state.offset}`);state.total=d.total;
    renderUsers(d.items||[]);$('userTotal').textContent=`共 ${d.total} 个账号`;
    const start=d.total?state.offset+1:0,end=Math.min(state.offset+state.limit,d.total);
    $('page').textContent=`${start}–${end} / ${d.total}`;$('prev').disabled=state.offset<=0;$('next').disabled=state.offset+state.limit>=d.total;
  }
  async function loadFeedback(){
    const items=await api('/api/admin/feedback');const box=$('feedback');
    if(!items.length){box.innerHTML='<div class="empty">暂无反馈</div>';return;}
    box.innerHTML=items.slice(0,30).map(x=>`<article class="feedback-item"><div class="feedback-meta"><span>${esc(x.nickname||'匿名')} · ${esc(x.category)} · ${time(x.created_at)}</span><span class="${x.status==='new'?'pending':'muted'}">${esc(x.status)}</span></div><div class="feedback-text">${esc(x.content)}</div><div class="feedback-meta"><span>${esc(x.email||'未留邮箱')}</span><span class="feedback-actions"><button class="secondary" data-feedback="${esc(x.id)}" data-status="reviewing">处理中</button><button class="secondary" data-feedback="${esc(x.id)}" data-status="resolved">已解决</button><button class="secondary" data-feedback="${esc(x.id)}" data-status="rejected">不采纳</button></span></div></article>`).join('');
  }
  async function loadAll(){
    state.token=$('adminToken').value.trim();if(!state.token){setStatus('请先输入 ADMIN_TOKEN。',true);return;}
    $('load').disabled=true;setStatus('正在验证令牌并读取 MySQL 统计…');
    try{sessionStorage.setItem('lawStudyAdminToken',state.token);const [overview]=await Promise.all([api('/api/admin/overview')]);renderMetrics(overview);await Promise.all([loadUsers(),loadFeedback()]);setStatus('验证成功。后台统计已从 MySQL 实时读取。');}
    catch(e){setStatus(e.message,true);$('metrics').innerHTML='<div class="empty">无法读取数据</div>';$('users').innerHTML='<tr><td colspan="11" class="empty">请检查令牌或服务端日志</td></tr>';}
    finally{$('load').disabled=false;}
  }
  $('load').onclick=loadAll;
  $('forget').onclick=()=>{sessionStorage.removeItem('lawStudyAdminToken');state.token='';$('adminToken').value='';setStatus('已清除当前标签页中的令牌。');};
  $('prev').onclick=async()=>{state.offset=Math.max(0,state.offset-state.limit);try{await loadUsers();}catch(e){setStatus(e.message,true);}};
  $('next').onclick=async()=>{state.offset+=state.limit;try{await loadUsers();}catch(e){setStatus(e.message,true);}};
  $('refreshFeedback').onclick=async()=>{try{await loadFeedback();setStatus('反馈列表已刷新。');}catch(e){setStatus(e.message,true);}};
  $('feedback').addEventListener('click',async e=>{const b=e.target.closest('[data-feedback]');if(!b)return;try{await api('/api/admin/feedback/'+encodeURIComponent(b.dataset.feedback),{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:b.dataset.status})});await loadFeedback();setStatus('反馈状态已更新。');}catch(err){setStatus(err.message,true);}});
  $('users').addEventListener('click',async e=>{const recovery=e.target.closest('[data-recovery-user]');if(recovery){if(!confirm('将立即生成新的永久设备连接码，旧连接码立即失效。请确认用户身份，并通过安全渠道把新码交给用户。继续吗？'))return;try{const d=await api('/api/admin/users/'+encodeURIComponent(recovery.dataset.recoveryUser)+'/recovery-code',{method:'POST'});prompt('新的永久设备连接码（仅显示这一次，请立即复制并安全交给用户）：',d.recovery_code);setStatus('已重置连接码。旧码已失效，新码请立即交给用户。');}catch(err){setStatus(err.message,true);}return;}const b=e.target.closest('[data-study-user]');if(!b)return;const current=(Number(b.dataset.studyMs)||0)/60000;const value=prompt('设置该用户的累计学习时长（分钟），可填写小数：',String(current.toFixed(1)));if(value===null)return;const minutes=Number(value);if(!Number.isFinite(minutes)||minutes<0){setStatus('学习时长必须是非负数字。',true);return;}try{await api('/api/admin/users/'+encodeURIComponent(b.dataset.studyUser)+'/study-time',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({total_ms:Math.round(minutes*60000)})});await loadUsers();setStatus('学习时长已修改。');}catch(err){setStatus(err.message,true);}});
  if(state.token)loadAll();
})();
</script>
</body>
</html>
